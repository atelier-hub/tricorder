name: Release Hackage package
on:
  workflow_call:
    inputs:
      package-name:
        description: Name of the package to release
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: tweag-tricorder
          authToken: "${{ secrets.CACHIX_TWEAG_TRICORDER_AUTH_TOKEN }}"
      - uses: sol/haskell-autotag@a535f2ac35a62c541de1919b04984b2970866f71
        id: tagging
        with:
          package-path: packages/${{ inputs.package-name }}
          prefix: ${{ inputs.package-name }}-
      - name: Pack
        if: ${{ steps.tagging.outputs.created }}
        run: |
          nix build .#${{ inputs.package-name }}-sdist
          mkdir -p ${{ runner.temp }}/release/packages
          cp result/*.tar.gz ${{ runner.temp }}/release/packages
      - name: Get default GHC version
        if: ${{ steps.tagging.outputs.created }}
        id: ghc-version
        run: |
          version=$(nix eval --raw --file nix/package/common.nix --apply 'x: x.default-ghc-version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553
        if: ${{ steps.tagging.outputs.created }}
        with:
          ghc-version: ${{ steps.ghc-version.outputs.version }}
          cabal-version: latest
      - name: Verify buildable against published Hackage dependencies
        # This project's own build always resolves atelier-core, tricorder-types,
        # etc. from local monorepo sources, so it can't catch a package that
        # relies on not-yet-published features/versions of its sibling
        # packages. Building the sdist in isolation, with a bare `cabal.project`
        # and no local path packages, forces cabal to resolve every dependency
        # from the real (non-candidate) Hackage index instead.
        if: ${{ steps.tagging.outputs.created }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          tar -xzf ${{ runner.temp }}/release/packages/*.tar.gz -C "$scratch"
          pkgdir="$(find "$scratch" -mindepth 1 -maxdepth 1 -type d)"
          cd "$pkgdir"
          echo "packages: ." > cabal.project
          cabal update
          cabal build all
      - name: Build docs
        if: ${{ steps.tagging.outputs.created }}
        run: |
          nix build .#${{ inputs.package-name }}-docs
          if test -f result-doc/*.tar.gz; then
            mkdir -p ${{ runner.temp }}/release/docs
            cp result-doc/*.tar.gz ${{ runner.temp }}/release/docs
          fi
      - name: Publish to Hackage
        if: ${{ steps.tagging.outputs.created }}
        uses: haskell-actions/hackage-publish@73c1489054aa60b7aa082cdde9b51502d960c0e1
        with:
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: ${{ runner.temp }}/release/packages
          docsPath: ${{ runner.temp }}/release/docs
          publish: true
      - name: Done
        if: ${{ steps.tagging.outputs.created }}
        run: |
          url="https://hackage.haskell.org/package/${{ steps.tagging.outputs.name }}/candidate"
          echo "Published candidate to $url"
          echo "- [${{ steps.tagging.outputs.name }}]($url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up stray tag on failure
        if: ${{ (failure() || cancelled()) && steps.tagging.outputs.created }}
        run: |
          git push --delete origin '${{ steps.tagging.outputs.name }}'
