version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "02:00"
    groups:
      github-actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: actions
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      day: monday
    groups:
      nix-flake-updates:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: nix inputs
